<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tart</title>
    <link rel="stylesheet" href="css/style.css?v=1.2">
</head>
<body>
    <div id="app" class="app sidebar-closed">
        <!-- Main Content Wrapper -->
        <div class="content" id="content">
            <header>
                <div class="header-left logo-toggle">
                    <h1><a href="/party" id="tart-logo-home" style="text-decoration:none; color:inherit;">Tart</a></h1>
                    <button id="sidebar-toggle" class="sidebar-toggle" aria-label="Toggle sidebar">
                        <span class="toggle-icon" aria-hidden="true"></span>
                    </button>
                </div>
                <p>A non-viral platform where art breathes.</p>
                <div id="auth-container">
                    <!-- Login/Account links will be here -->
                </div>
            </header>
            <main class="page-has-sidebar">
                <div class="page-layout" id="page-layout">
                    <!-- Sidebar lives inside the page, below the header -->
                    <aside id="sidebar" class="sidebar" aria-label="Primary">
                        <div class="sidebar-inner">
                            <nav class="sidebar-nav">
                                <button class="nav-item" id="nav-home" data-page="home">Home</button>
                                <button class="nav-item" id="nav-tart" data-page="tart">Tart</button>
                                <button class="nav-item" id="nav-about" data-page="about">About us</button>
                            </nav>
                        </div>
                    </aside>

                    <div class="main-panel" id="main-panel">
                <!-- Filters (AREA17-style) -->
                <div class="home-filter-container">
                    <div class="filter-container">
                        <button class="filter-trigger" id="filter-trigger" aria-expanded="false" aria-controls="filter-panel">
                            <span>Filter</span>
                            <div class="filter-arrow" aria-hidden="true"></div>
                        </button>
                        <div class="filter-panel" id="filter-panel" aria-hidden="true">
                            <div class="filter-section">
                                <div class="filter-section-title">Medium</div>
                                <div class="medium-filters">
                                    <label class="filter-option"><input type="checkbox" class="filter-checkbox" value="poetry" /><div class="filter-checkmark"></div><span class="filter-label">Poetry</span></label>
                                    <label class="filter-option"><input type="checkbox" class="filter-checkbox" value="painting" /><div class="filter-checkmark"></div><span class="filter-label">Painting</span></label>
                                    <label class="filter-option"><input type="checkbox" class="filter-checkbox" value="oil-painting" /><div class="filter-checkmark"></div><span class="filter-label">Oil Painting</span></label>
                                    <label class="filter-option"><input type="checkbox" class="filter-checkbox" value="ink-painting" /><div class="filter-checkmark"></div><span class="filter-label">Ink Painting</span></label>
                                    <label class="filter-option"><input type="checkbox" class="filter-checkbox" value="colored-pencil" /><div class="filter-checkmark"></div><span class="filter-label">Colored Pencil</span></label>
                                    <label class="filter-option"><input type="checkbox" class="filter-checkbox" value="sketch" /><div class="filter-checkmark"></div><span class="filter-label">Sketch</span></label>
                                    <label class="filter-option"><input type="checkbox" class="filter-checkbox" value="photography" /><div class="filter-checkmark"></div><span class="filter-label">Photography</span></label>
                                    <label class="filter-option"><input type="checkbox" class="filter-checkbox" value="industrial-design" /><div class="filter-checkmark"></div><span class="filter-label">Industrial Design</span></label>
                                </div>
                            </div>
                            <div class="filter-section">
                                <div class="filter-section-title">Sort By</div>
                                <div class="sort-filters">
                                    <label class="sort-option"><input type="radio" class="sort-radio" name="sort" value="default" checked /><div class="sort-radio-mark"></div><span class="filter-label">Default</span></label>
                                    <label class="sort-option"><input type="radio" class="sort-radio" name="sort" value="popularity" /><div class="sort-radio-mark"></div><span class="filter-label">Popularity</span></label>
                                    <label class="sort-option"><input type="radio" class="sort-radio" name="sort" value="latest" /><div class="sort-radio-mark"></div><span class="filter-label">Latest</span></label>
                                </div>
                            </div>
                            <div class="filter-actions">
                                <div class="filter-count" id="filter-count">0 filters applied</div>
                                <div class="filter-buttons">
                                    <button class="filter-btn filter-btn--clear" id="clear-filters" type="button">Clear</button>
                                    <button class="filter-btn filter-btn--apply" id="apply-filters" type="button">Apply</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Sticky showcase section: left hero stays pinned while right column scrolls -->
                <section id="showcase" class="showcase">
                    <div class="showcase-left">
                        <div id="sticky-hero"></div>
                    </div>
                    <div class="showcase-right">
                        <div id="sticky-grid" class="showcase-grid"></div>
                    </div>
                </section>

                <!-- Remaining artworks use the featured rhythm grid -->
                <div id="artworks-container" class="gallery"></div>

                <!-- Dynamic page container for Tart/About -->
                <section id="page-content" class="page-content" hidden></section>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script src="js/main.js"></script>
</body>
</html>
